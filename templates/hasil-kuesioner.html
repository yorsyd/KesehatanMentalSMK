<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ringkasan Hasil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #eef1f4;
      --panel: #ffffff;
      --ink: #16232f;
      --muted: #5b6b7a;
      --line: #d7dee4;
      --teal: #0f8b8d;
      --teal-soft: #e2f2f2;
      --amber: #b8873a;
      --violet: #4a4fd6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .hero {
      padding: 36px 0 28px;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      margin: 0 0 12px;
      letter-spacing: -0.01em;
    }

    .lede {
      color: var(--muted);
      max-width: 60ch;
      line-height: 1.6;
      margin: 0;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      padding: 8px 0 32px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
    }

    .btn:hover {
      background: #fafbfc;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 26px 28px;
      margin-bottom: 20px;
    }

    .section[data-accent="teal"] {
      border-top: 3px solid var(--teal);
    }

    .section[data-accent="amber"] {
      border-top: 3px solid var(--amber);
    }

    .section[data-accent="violet"] {
      border-top: 3px solid var(--violet);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      margin: 0;
    }

    .section-meta {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    .score-pill {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      background: var(--teal-soft);
      color: var(--teal);
      border-radius: 20px;
      padding: 5px 12px;
      white-space: nowrap;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
      margin-bottom: 18px;
    }

    .score-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .score-card .sc-label {
      font-size: 0.76rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-family: 'IBM Plex Mono', monospace;
    }

    .score-card .sc-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin: 2px 0 6px;
    }

    .sev-badge {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .sev-normal, .sev-sangat-rendah { background: #e3f5e9; color: #2a8f52; }
    .sev-mild, .sev-rendah { background: #eaf6e6; color: #4d8f2a; }
    .sev-moderate, .sev-sedang { background: #fdf3d8; color: #9a7413; }
    .sev-severe, .sev-tinggi { background: #fde6d3; color: #b2611a; }
    .sev-extremely-severe, .sev-sangat-tinggi { background: #fbdede; color: #c03f3f; }

    .empty-state {
      text-align: center;
      padding: 26px 10px;
    }

    .empty-state p {
      color: var(--muted);
      margin: 0 0 14px;
      font-size: 0.92rem;
    }

    .empty-state a {
      color: var(--teal);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }

    th {
      text-align: left;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 9px 6px;
      font-size: 0.88rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      line-height: 1.5;
    }

    td.qnum {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
      width: 34px;
    }

    td.ans {
      font-weight: 600;
      width: 56px;
      text-align: center;
    }

    tr:last-child td {
      border-bottom: none;
    }

    @media (max-width:600px) {
      h1 { font-size: 1.6rem; }
      .section { padding: 20px 18px; }
      .score-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  {% include 'partials/navbar.html' %}

  <div class="wrap">
    <div class="hero">
      <div class="eyebrow">Ringkasan Hasil Siswa</div>
      <h1>Hasil Kuesioner Anda</h1>
      <p class="lede">Halaman ini menampilkan riwayat hasil kuesioner yang tersimpan resmi di akun Anda. Jika kuesioner belum diisi, halaman akan menampilkan status kosong.</p>
    </div>

    <div class="toolbar">
      <button class="btn" onclick="location.reload()">Muat Ulang</button>
      <button class="btn" onclick="downloadJSON()">Unduh sebagai JSON</button>
    </div>

    <div id="results"></div>
  </div>

  {% include 'partials/footer.html' %}

  <script>
    // Data DB yang di-inject secara langsung dari Backend Flask ke Javascript
    const dbData = {{ kuesioner_db | tojson | safe }};

    // Daftar Pertanyaan untuk Rendering Tabel
    const questionsList = {
      dass21: [
        "Saya sama sekali tidak dapat merasakan perasaan positif.",
        "Saya merasa sulit berinisiatif melakukan sesuatu.",
        "Saya merasa tidak ada lagi yang bisa saya harapkan.",
        "Saya merasa sedih dan tertekan.",
        "Saya tidak bisa merasa antusias terhadap hal apapun.",
        "Saya merasa diri saya tidak berharga.",
        "Saya merasa hidup ini tidak berarti.",
        "Saya merasa rongga mulut saya kering.",
        "Saya merasa kesulitan bernafas.",
        "Saya merasa gemetar.",
        "Saya merasa khawatir menjadi panik.",
        "Saya merasa hampir panik.",
        "Saya menyadari kondisi jantung saya.",
        "Saya merasa ketakutan tanpa alasan jelas.",
        "Saya merasa sulit untuk beristirahat.",
        "Saya cenderung menunjukkan reaksi berlebihan.",
        "Saya merasa energi saya terkuras.",
        "Saya merasa gelisah.",
        "Saya merasa sulit untuk merasa tenang.",
        "Saya sulit untuk bersabar.",
        "Perasaan saya mudah tergugah."
      ],
      afeksi_positif: [
        "Saat ini saya merasa bersemangat.", "Saat ini saya merasa kuat.", "Saat ini saya merasa aktif.", "Saat ini saya merasa waspada/ siap mengantisipasi.", "Saat ini saya merasa konsentrasi.", "Saat ini saya merasa teguh/ kokoh.", "Saat ini saya merasa mempunyai ide.", "Saat ini saya merasa berminat.", "Saat ini saya merasa antusias/ punya motivasi.", "Saat ini saya merasa tegar.",
        "Biasanya saya merasa bersemangat.", "Biasanya saya merasa kuat.", "Biasanya saya merasa aktif.", "Biasanya saya merasa waspada/siap mengantisipasi.", "Biasanya saya merasa konsentrasi.", "Biasanya saya merasa teguh/kokoh.", "Biasanya saya merasa mempunyai ide.", "Biasanya saya merasa berminat.", "Biasanya saya merasa antusias/punya motivasi.", "Biasanya saya merasa tegar."
      ],
      afeksi_negatif: [
        "Saat ini saya merasa tegang", "Saat ini saya merasa putus asa", "Saat ini saya merasa ngeri", "Saat ini saya merasa jengkel", "Saat ini saya merasa mudah tersinggung", "Saat ini saya merasa malu", "Saat ini saya merasa takut", "Saat ini saya merasa gelisah", "Saat ini saya merasa gugup", "Saat ini saya merasa kecewa",
        "Biasanya saya merasa tegang", "Biasanya saya merasa putus asa", "Biasanya saya merasa ngeri", "Biasanya saya merasa jengkel", "Biasanya saya merasa mudah tersinggung", "Biasanya saya merasa malu", "Biasanya saya merasa takut", "Biasanya saya merasa gelisah", "Biasanya saya merasa gugup", "Biasanya saya merasa kecewa"
      ]
    };

    const configs = [
      { key: 'dass21', accent: 'teal', title: 'kuesioner DASS-21', link: "{{ url_for('kuesioner_dass') }}", linkLabel: 'Isi kuesioner DASS-21' },
      { key: 'afeksi_negatif', accent: 'amber', title: 'Skala Afeksi Negatif', link: "{{ url_for('kuesioner_afek_negatif') }}", linkLabel: 'Isi Skala Afeksi Negatif' },
      { key: 'afeksi_positif', accent: 'violet', title: 'Skala Afeksi Positif', link: "{{ url_for('kuesioner_afek_positif') }}", linkLabel: 'Isi Skala Afeksi Positif' }
    ];

    const dassRanges = {
      depression: [
        { max: 9, label: 'Normal', cls: 'sev-normal' },
        { max: 13, label: 'Mild', cls: 'sev-mild' },
        { max: 20, label: 'Moderate', cls: 'sev-moderate' },
        { max: 27, label: 'Severe', cls: 'sev-severe' },
        { max: Infinity, label: 'Extremely Severe', cls: 'sev-extremely-severe' }
      ],
      anxiety: [
        { max: 7, label: 'Normal', cls: 'sev-normal' },
        { max: 9, label: 'Mild', cls: 'sev-mild' },
        { max: 14, label: 'Moderate', cls: 'sev-moderate' },
        { max: 19, label: 'Severe', cls: 'sev-severe' },
        { max: Infinity, label: 'Extremely Severe', cls: 'sev-extremely-severe' }
      ],
      stress: [
        { max: 14, label: 'Normal', cls: 'sev-normal' },
        { max: 18, label: 'Mild', cls: 'sev-mild' },
        { max: 25, label: 'Moderate', cls: 'sev-moderate' },
        { max: 33, label: 'Severe', cls: 'sev-severe' },
        { max: Infinity, label: 'Extremely Severe', cls: 'sev-extremely-severe' }
      ]
    };

    function classifyDass(type, score) {
      const ranges = dassRanges[type];
      for (const r of ranges) {
        if (score <= r.max) return r;
      }
      return ranges[ranges.length - 1];
    }

    function formatDate(iso) {
      if (!iso) return '-';
      try {
        const d = new Date(iso);
        return d.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
      } catch (e) {
        return iso;
      }
    }

    function render() {
      const container = document.getElementById('results');
      container.innerHTML = '';

      configs.forEach(cfg => {
        const data = dbData[cfg.key];
        const section = document.createElement('div');
        section.className = 'section';
        section.dataset.accent = cfg.accent;

        // Jika data belum ada di DB (Siswa baru / belum pernah isi)
        if (!data) {
          section.innerHTML = `
            <div class="section-head">
              <h2 class="section-title">${cfg.title}</h2>
            </div>
            <div class="empty-state">
              <p>Belum ada jawaban tersimpan untuk kuesioner ini pada akun Anda.</p>
              <a href="${cfg.link}">${cfg.linkLabel} &rarr;</a>
            </div>
          `;
          container.appendChild(section);
          return;
        }

        // Jika data tersedia dari DB
        const questions = questionsList[cfg.key] || [];
        const answers = data.answers || {};

        const rows = questions.map((qText, idx) => {
          const qKey = 'q' + (idx + 1);
          const ans = answers[qKey] !== undefined ? answers[qKey] : '&mdash;';
          return `
            <tr>
              <td class="qnum">${idx + 1}</td>
              <td>${qText}</td>
              <td class="ans">${ans}</td>
            </tr>
          `;
        }).join('');


        section.innerHTML = `
          <div class="section-head">
            <div>
              <h2 class="section-title">${data.label || cfg.title}</h2>
              <div class="section-meta">Diisi ${formatDate(data.submitted_at)}</div>
            </div>
          </div>
          <table>
            <thead>
              <tr><th>No</th><th>Pernyataan</th><th>Jawaban</th></tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        `;
        container.appendChild(section);
      });
    }

    function downloadJSON() {
      if (Object.keys(dbData).length === 0) {
        alert('Belum ada hasil yang bisa diunduh.');
        return;
      }
      const blob = new Blob([JSON.stringify(dbData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'hasil-kuesioner-siswa.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Bersihkan cache localStorage lokal jika ada
    localStorage.removeItem('dass21_result');
    localStorage.removeItem('afeksi_negatif_result');
    localStorage.removeItem('afeksi_positif_result');

    render();
  </script>

</body>

</html>
